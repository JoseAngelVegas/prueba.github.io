<html>

  <div>
    <p class ="nombre">Esto es una prueba 9</p>
    <button onclick="cambiaColor"()>Cambia de color</button>
  </div>


  
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  p {
    font-size: 2rem;
  }

  button {
    padding: 7px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button.azul {
    background-color: #3498db;
  }

  button.verde {
    background-color: #2ecc71;
  }

<p>

  const nombre = document.querySelector('nombre');
  function cambiaColor() {
    nombre.style.color = "white";
  }

</p>
</style>
</html>
